<body>
<div id="stage"><canvas id="c" width="320" height="180"></canvas></div>
<p>You are Samuel Hawari (red) · CPU is Noah Irvine (blue)<br>Move: A / D or ← / → · Jump: W, ↑ or Space (touch: tap the top half) · First to 7 · M = mute</p>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = 320, H = 180, GROUND = 150, NET = 160, WIN = 7;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- players ----------
const P = { x: 40, vx: 0, y: 0, vy: 0, cd: 0, cpu: false, jersey: '#d8453a' };
const C = { x: 250, vx: 0, y: 0, vy: 0, cd: 0, cpu: true, jersey: '#3a6fd8', err: 0 };
const ball = { x: 70, y: 30, vx: 0, vy: 0, r: 5, a: 0 };
const sc = { p: 0, c: 0 };
let state = 'title', timer = 0, t = 0, rally = 0, best = 0, msg = '', muted = false, parts = [];

// ---------- input ----------
const keys = {}; let touchDir = 0, touchJump = false;
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key === 'Enter') action();
  if (e.key.toLowerCase() === 'm') muted = !muted;
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function touch(e) {
  if (!e.touches.length) { touchDir = 0; touchJump = false; return; }
  const r = c.getBoundingClientRect();
  touchDir = (e.touches[0].clientX - r.left) < r.width / 2 ? -1 : 1;
  touchJump = (e.touches[0].clientY - r.top) < r.height * 0.45;
}
c.addEventListener('touchstart', e => { action(); touch(e); e.preventDefault(); });
c.addEventListener('touchmove', e => { touch(e); e.preventDefault(); });
c.addEventListener('touchend', e => { touch(e); e.preventDefault(); });
c.addEventListener('mousedown', action);
function action() { if (state === 'title' || state === 'over') { sc.p = sc.c = 0; serve('p'); } }

// ---------- sound ----------
let ac;
function snd(f, d, type = 'square', v = 0.05) {
  if (muted) return;
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---------- helpers ----------
function serve(side) {
  state = 'serve'; timer = 70; rally = 0; C.err = (Math.random() - 0.5) * 14;
  ball.x = side === 'p' ? 70 : 250; ball.y = 30; ball.vx = 0; ball.vy = 0;
}
function boxes(g) {   // head, neck, body (mirrored for the CPU)
  return [[14, 62, 18, 10], [18, 72, 6, 44], [0, 116, 26, 14]].map(([x, y, w, h]) =>
    ({ x: g.cpu ? 2 * (g.x + 15) - (g.x + x) - w : g.x + x, y: y + g.y, w, h }));
}
const neck = g => boxes(g)[1].x + 3;
function spawn(x, y, n, cols) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2.5, l: 25 + Math.random() * 15, col: cols[i % cols.length] });
}
function jumpPhysics(g, want) {
  if (want && g.y === 0) { g.vy = -5.2; snd(520, .06, 'triangle'); }
  if (g.y < 0 || g.vy < 0) { g.vy += 0.35; g.y += g.vy; if (g.y >= 0) { g.y = 0; g.vy = 0; } }
}
function cpuWantsJump() {
  return state === 'play' && C.y === 0 && ball.vy > 0 && ball.y < 55 && Math.abs(ball.x - neck(C)) < 22 && Math.random() < 0.08;
}
function predict() {   // where will the ball be when it comes down to head height?
  let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  for (let i = 0; i < 400; i++) {
    vy += 0.1; x += vx; y += vy;
    if (x < 5 || x > W - 5) vx = -vx;
    if (y < 5) { y = 5; vy = -vy; }
    if (vy > 0 && y >= 64) return x;
  }
  return x;
}

// ---------- update ----------
function update() {
  t++;
  parts.forEach(p => { p.vy += 0.08; p.x += p.vx; p.y += p.vy; p.l--; });
  parts = parts.filter(p => p.l > 0 && p.y < H);
  if (state === 'title') return;

  // you
  const d = (keys.d || keys.arrowright || touchDir > 0) - (keys.a || keys.arrowleft || touchDir < 0);
  P.vx = d * 2.2; P.x = clamp(P.x + P.vx, 2, NET - 36);
  jumpPhysics(P, keys.w || keys.arrowup || keys[' '] || touchJump);

  // CPU: guess where the ball lands, walk there (a bit slower than you, with small aiming errors)
  let tx = 235;
  if (state === 'play' || state === 'serve') { const px = predict(); if (px > NET - 10) tx = px + 1 + C.err; }
  tx = clamp(tx, NET + 8, W - 34);
  const dx = tx - C.x; C.vx = Math.abs(dx) > 1.5 ? Math.sign(dx) * 1.9 : 0;
  C.x = clamp(C.x + C.vx, NET + 8, W - 34);
  jumpPhysics(C, cpuWantsJump());

  if (state === 'serve') { if (--timer <= 0) state = 'play'; return; }
  if (state === 'point') { if (--timer <= 0) serve(msg === 'SAMUEL SCORES!' ? 'p' : 'c'); return; }
  if (state !== 'play') return;

  // ball
  ball.vy += 0.1; ball.x += ball.vx; ball.y += ball.vy; ball.a += ball.vx * 0.12;
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); snd(180, .05); }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); snd(180, .05); }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
  if (ball.y + ball.r > 100 && Math.abs(ball.x - NET) < ball.r + 1) {   // the net
    const s = ball.x < NET ? -1 : 1;
    ball.vx = s * Math.abs(ball.vx) * 0.8; ball.x = NET + s * (ball.r + 1); snd(120, .08, 'triangle');
  }

  // hits
  for (const g of [P, C]) {
    if (g.cd > 0) { g.cd--; continue; }
    for (const r of boxes(g)) {
      const cx = clamp(ball.x, r.x, r.x + r.w), cy = clamp(ball.y, r.y, r.y + r.h);
      if (Math.hypot(ball.x - cx, ball.y - cy) < ball.r) {
        ball.vy = -clamp(Math.abs(ball.vy) * 0.9 + 0.5, 3.2, 4.2);
        ball.vx = clamp((ball.x - neck(g)) * 0.15 + g.vx * 0.5, -3, 3);
        if (g.y < -8) {   // hit while in the air = a fast, flat spike toward the other side
          ball.vy = -1.8; ball.vx = clamp(ball.vx * 1.4 + (g.cpu ? -1 : 1), -3.8, 3.8);
          spawn(ball.x, ball.y, 8, ['#ff9f43', '#ffe27a']); snd(220, .12, 'sawtooth');
        }
        g.cd = 10; rally++; best = Math.max(best, rally);
        C.err = (Math.random() - 0.5) * 14;
        spawn(ball.x, ball.y, 6, ['#fff', '#ffe27a']); snd(g.cpu ? 330 : 440, .08);
        break;
      }
    }
  }

  // ball hits the sand = point
  if (ball.y + ball.r >= GROUND) {
    ball.y = GROUND - ball.r;
    const w = ball.x < NET ? 'c' : 'p';
    sc[w]++; spawn(ball.x, GROUND, 16, ['#e4c887', '#f6e1ab']); snd(w === 'p' ? 660 : 160, .3, 'triangle', .08);
    if (sc[w] >= WIN) { state = 'over'; msg = w === 'p' ? 'SAMUEL WINS!' : 'NOAH WINS'; }
    else { state = 'point'; timer = 80; msg = w === 'p' ? 'SAMUEL SCORES!' : 'NOAH SCORES'; }
  }
}

// ---------- drawing (everything is tiny rectangles) ----------
function rect(col, x, y, w, h) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function T(s, x, y, size, col, al = 'center') {
  ctx.fillStyle = col; ctx.font = 'bold ' + size + 'px "Courier New", monospace'; ctx.textAlign = al; ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(s, x + 1, y + 1); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const SKY = ['#3fa9e5', '#5bbaec', '#79c9f1', '#98d7f5', '#b7e4f8', '#d3f0fb'];
const cloud = (x, y) => { rect('#fff', x, y, 26, 6); rect('#fff', x + 5, y - 4, 14, 5); };
function palm(x) {
  rect('#7a4a1e', x - 1, 66, 3, 40);
  rect('#2f9e44', x - 12, 62, 24, 4); rect('#2f9e44', x - 8, 58, 16, 4);
  rect('#237a35', x - 14, 66, 8, 3); rect('#237a35', x + 6, 66, 8, 3);
}
function background() {
  ctx.clearRect(0, 0, W, H);                               // transparent: the picture sits behind the canvas
  rect('rgba(40,32,70,.55)', 10, 150, 300, 24);            // court floor
  for (const [x, y, w, h] of [[10, 150, 300, 1], [10, 173, 300, 1], [10, 150, 1, 24], [309, 150, 1, 24], [NET - 1, 150, 2, 24]]) rect('#fff', x, y, w, h);
}
function drawNet() {
  rect('#d9d9d9', NET - 1, 98, 2, 52);
  for (let y = 102; y < 150; y += 4) rect('#c4c4c4', NET - 5, y, 10, 1);
  for (let y = 102; y < 150; y += 8) for (let x = NET - 5; x < NET + 5; x += 4) rect('#c4c4c4', x, y, 1, 4);
  rect('#fff', NET - 5, 100, 10, 2); rect('#d8453a', NET - 2, 96, 4, 3);
}
function drawG(g) {
  const x = Math.round(g.x), Y = '#f2b632', S = '#a8621c', D = '#5a3510', B = '#d99a1f';
  const b = boxes(g)[2]; rect('rgba(0,0,0,.2)', b.x - 4, GROUND, b.w + 8, 3);   // shadow
  ctx.save(); ctx.translate(0, Math.round(g.y));
  if (g.cpu) { ctx.translate(2 * (x + 15), 0); ctx.scale(-1, 1); }
  const bob = Math.abs(g.vx) > 0 ? ((t >> 2) & 1) : 0;                         // little walking wiggle
  for (const lx of [1, 6, 18, 23]) { rect(Y, x + lx, 130, 3, 20); rect(D, x + lx, 148, 3, 2); }
  rect(B, x + 1, 130, 2, 18); rect(B, x + 19, 130, 2, 18);
  rect(D, x - 3, 118 + bob, 3, 8); rect(D, x - 4, 125 + bob, 4, 3);                 // tail
  rect(Y, x, 116, 26, 14); rect(B, x, 128, 26, 2);                              // body
  rect(g.jersey, x + 8, 116, 10, 9); rect('#fff', x + 11, 118, 4, 5);           // jersey + number
  rect(Y, x + 18, 70, 6, 48);                                                   // neck
  rect(D, x + 17, 70, 1, 44);                                                   // mane
  rect(Y, x + 15, 62, 14, 9); rect(Y, x + 29, 65, 4, 6); rect(B, x + 29, 69, 4, 2);
  rect('#fff', x + 23, 63, 3, 3); rect('#000', x + 24, 64, 2, 2);               // eye
  rect(D, x + 31, 66, 1, 1);
  rect(g.jersey, x + 15, 61, 14, 2);                                            // headband
  rect(D, x + 18, 57, 1, 4); rect(D, x + 23, 57, 1, 4); rect(D, x + 17, 56, 3, 2); rect(D, x + 22, 56, 3, 2);
  for (const [sx, sy] of [[2, 125], [20, 125], [19, 76], [20, 90], [19, 104], [5, 118]]) rect(S, x + sx, sy, 4, 4);
  ctx.restore();
}
function tag(g, name, col) {   // name label that follows the giraffe's head
  ctx.font = 'bold 7px "Courier New", monospace';
  const w = Math.ceil(ctx.measureText(name).width) + 6, x = Math.round(clamp(neck(g) - w / 2, 2, W - w - 2)), y = Math.round(49 + g.y);
  rect('rgba(20,32,44,.75)', x, y - 8, w, 10); rect(col, x, y + 2, w, 1);
  T(name, x + w / 2, y, 7, col);
}
function drawBall() {
  const bx = Math.round(ball.x), by = Math.round(ball.y), r = ball.r;
  const w = Math.max(4, 10 - (GROUND - ball.y) / 25); rect('rgba(0,0,0,.2)', ball.x - w / 2, GROUND + 1, w, 2);
  const ca = Math.cos(ball.a), sa = Math.sin(ball.a);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const d2 = dx * dx + dy * dy; if (d2 > r * r + 1) continue;
    const u = dx * ca + dy * sa;
    let col = Math.abs(u) < 1.5 ? '#3a6fd8' : (u > 3 || u < -3 ? '#f2c230' : '#fff');
    if (d2 > (r - 1) * (r - 1) + 1) col = '#9a9a9a';
    rect(col, bx + dx, by + dy, 1, 1);
  }
}
function hud() {
  rect('#14202c', 82, 4, 156, 20); rect('#f4e9c8', 82, 4, 156, 1); rect('#f4e9c8', 82, 23, 156, 1);
  T('SAMUEL', 114, 17, 9, '#ff8a80'); T(String(sc.p), 147, 18, 12, '#fff');
  T(':', 160, 17, 10, '#f4e9c8'); T(String(sc.c), 173, 18, 12, '#fff'); T('NOAH', 205, 17, 9, '#82aaff');
  if (rally > 1) T('RALLY ' + rally, 160, 36, 8, '#fff');
}
function draw() {
  background(); drawNet(); drawG(P); drawG(C); drawBall();
  tag(P, 'SAMUEL HAWARI', '#ff8a80'); tag(C, 'NOAH IRVINE', '#82aaff');
  parts.forEach(p => rect(p.col, p.x, p.y, 1, 1));
  if (state !== 'title') hud();
  if (state === 'title') {
    rect('rgba(20,32,44,.75)', 50, 50, 220, 70);
    T('UNIQUE GAME', 160, 78, 18, '#f2b632');
    T('SAMUEL HAWARI  vs  NOAH IRVINE', 160, 94, 8, '#f4e9c8');
    if ((t >> 5) & 1) T('PRESS SPACE OR TAP', 160, 110, 9, '#fff');
  }
  if (state === 'serve') T(timer > 35 ? 'READY' : 'GO!', 160, 70, 14, '#fff');
  if (state === 'point') T(msg, 160, 70, 14, '#fff');
  if (state === 'over') {
    rect('rgba(20,32,44,.8)', 50, 50, 220, 70);
    T(msg, 160, 78, 18, msg === 'SAMUEL WINS!' ? '#ffe27a' : '#ff8a80');
    T('FINAL ' + sc.p + ' - ' + sc.c + ' · BEST RALLY ' + best, 160, 94, 8, '#f4e9c8');
    if ((t >> 5) & 1) T('PRESS SPACE OR TAP TO REMATCH', 160, 110, 8, '#fff');
  }
}
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
